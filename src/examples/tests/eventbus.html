<!DOCTYPE html>
<html>
    <head>
        <title>EventBus Test</title>
        <style>
            body {
                font-family: monospace;
                background: #1a1a2e;
                color: #e0e0e0;
                padding: 20px;
            }
            h1 { color: #0ff; }
            .pass { color: #0f0; }
            .fail { color: #f44; }
            #log { white-space: pre; line-height: 1.8; }
            button {
                background: #333;
                color: #fff;
                border: 1px solid #555;
                padding: 8px 16px;
                margin: 4px;
                cursor: pointer;
                font-family: monospace;
            }
            button:hover { background: #555; }
        </style>
    </head>
    <body>
        <h1>EventBus Test</h1>
        <div>
            <button id="runTests">Run Automated Tests</button>
            <button id="emitCustom">Emit 'hello'</button>
            <button id="emitOnce">Emit 'oneshot'</button>
        </div>
        <div id="log"></div>
        <script type="module">
            import EventBus from '../../Jest/EventBus.js';

            const log = document.getElementById('log');
            let testNum = 0;

            function assert(condition, label) {
                testNum++;
                const status = condition ? 'PASS' : 'FAIL';
                const cls = condition ? 'pass' : 'fail';
                log.innerHTML += `<span class="${cls}">[${status}]</span> #${testNum}: ${label}\n`;
            }

            function logMsg(msg) {
                log.innerHTML += `      ${msg}\n`;
            }

            document.getElementById('runTests').addEventListener('click', () => {
                log.innerHTML = '';
                testNum = 0;

                const bus = new EventBus();

                // Test 1: on + emit
                let received = false;
                bus.on('test1', () => { received = true; });
                bus.emit('test1');
                assert(received === true, 'on() + emit() delivers event');

                // Test 2: emit with data
                let data = null;
                bus.on('test2', (d) => { data = d; });
                bus.emit('test2', { x: 42 });
                assert(data && data.x === 42, 'emit() passes data to handler');

                // Test 3: multiple args
                let a1 = 0;
                let a2 = 0;
                bus.on('test3', (x, y) => { a1 = x; a2 = y; });
                bus.emit('test3', 10, 20);
                assert(a1 === 10 && a2 === 20, 'emit() passes multiple args');

                // Test 4: multiple listeners
                let count = 0;
                bus.on('test4', () => { count++; });
                bus.on('test4', () => { count++; });
                bus.on('test4', () => { count++; });
                bus.emit('test4');
                assert(count === 3, 'Multiple listeners all fire (3 listeners = 3 calls)');

                // Test 5: off removes specific listener
                let offResult = 0;
                const handler = () => { offResult++; };
                bus.on('test5', handler);
                bus.emit('test5');
                bus.off('test5', handler);
                bus.emit('test5');
                assert(offResult === 1, 'off() removes specific listener (fired once, not twice)');

                // Test 6: off without callback removes all
                let offAllCount = 0;
                bus.on('test6', () => { offAllCount++; });
                bus.on('test6', () => { offAllCount++; });
                bus.off('test6');
                bus.emit('test6');
                assert(offAllCount === 0, 'off(event) with no callback removes all listeners');

                // Test 7: once
                let onceCount = 0;
                bus.once('test7', () => { onceCount++; });
                bus.emit('test7');
                bus.emit('test7');
                bus.emit('test7');
                assert(onceCount === 1, 'once() fires exactly once (emitted 3 times, count=1)');

                // Test 8: emit non-existent event
                let threw = false;
                try {
                    bus.emit('doesNotExist');
                } catch (e) {
                    threw = true;
                }
                assert(!threw, 'Emitting non-existent event does not throw');

                // Test 9: chaining
                const bus2 = new EventBus();
                const result = bus2.on('chain', () => {}).emit('chain').off('chain');
                assert(result === bus2, 'Methods are chainable (return this)');

                logMsg('');
                logMsg(`All tests complete: ${testNum} tests run`);
            });

            // Interactive tests
            const liveBus = new EventBus();

            liveBus.on('hello', (msg) => {
                logMsg(`[LIVE] hello event received: "${msg}"`);
            });

            liveBus.once('oneshot', () => {
                logMsg('[LIVE] oneshot fired! (will not fire again)');
            });

            document.getElementById('emitCustom').addEventListener('click', () => {
                liveBus.emit('hello', 'world ' + Date.now());
            });

            document.getElementById('emitOnce').addEventListener('click', () => {
                liveBus.emit('oneshot');
                logMsg('[LIVE] oneshot emit attempted');
            });
        </script>
    </body>
</html>
